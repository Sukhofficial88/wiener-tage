name: Map data from OpenStreetMap

# Rebuilds the city maps (data/map/*.json) from fresh OpenStreetMap data:
# streets, water, parks and buildings around every route (Overpass) and walking routes between stops (OSRM).
# Run it by hand: Actions → "Map data from OpenStreetMap" → Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download OpenStreetMap data and walking routes
        run: node tools/map/fetch-osm.mjs
        timeout-minutes: 50
      - name: Build map files
        run: node tools/map/build-map.mjs
      - name: Commit map files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898099+github-actions[bot]@users.noreply.github.com"
          git add data/map
          git commit -m "Update city maps from OpenStreetMap" || echo "no changes"
          git push
