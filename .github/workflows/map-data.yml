name: Map data from OpenStreetMap

# Downloads streets, water, parks and buildings around every route (Overpass)
# and the walking routes between stops (OSRM) into tools/map/raw/ on the branch it runs on.
on:
  workflow_dispatch:
  push:
    branches: [map-data]
    paths: ["tools/map/fetch-osm.mjs", ".github/workflows/map-data.yml", "js/data.js"]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/map/fetch-osm.mjs
        timeout-minutes: 50
      - name: Commit raw data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898099+github-actions[bot]@users.noreply.github.com"
          git add tools/map/raw
          git commit -m "Raw OpenStreetMap data and walking routes" || echo "nothing to commit"
          git push
